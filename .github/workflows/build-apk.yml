name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Required for AGP 9+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Easy Install
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ./HDHub4u-CineStream.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HDHub4u-App-APK
          path: ./HDHub4u-CineStream.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release (Direct Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "HDHub4u CineStream v1.0 (Latest APK)"
          body: |
            ### 📱 Download Android APK
            Click the link below to download the app directly to your phone:
            - **[HDHub4u-CineStream.apk](https://github.com/${{ github.repository }}/releases/download/latest/HDHub4u-CineStream.apk)**
          files: ./HDHub4u-CineStream.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
